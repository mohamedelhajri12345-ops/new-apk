name: wallpaper_ringtone_hub
description: تطبيق خلفيات ونغمات وثيمات حلال مع إعلانات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_mobile_ads: ^4.0.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  image_gallery_saver: ^2.0.3
  permission_handler: ^11.0.1
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  provider: ^6.1.1
  just_audio: ^0.9.36

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/ringtones/
    - assets/data/
